[project]
name = "kusys-backend"
version = "1.0.0"
description = "KuSys modular monolith backend"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "celery==5.6.3",
  "redis==8.1.0",
  "python-multipart==0.0.32",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "PyMuPDF==1.28.2",
  "pdfplumber==0.11.10",
  "ocrmypdf==17.12.1",
  "PyYAML==6.0.3",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["kusys*"]
