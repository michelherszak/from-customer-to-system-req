# Docker may assign a new address when the backend container is recreated.
# Resolve the service continuously instead of keeping its startup address.
upstream kusys_backend {
    zone kusys_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://kusys_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
